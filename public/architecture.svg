<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="15" fill="none" stroke="#a0a0a0" stroke-width="2">
  <title id="t">Scenery architecture</title>
  <desc id="d">An AI client talks to the Scenery runner on the same laptop. The Scenery runner stays in sync with the Scenery control plane.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a0a0a0" stroke="none"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="200" rx="10" fill="#17181c" stroke="none"/>
  <rect x="10" y="60" width="190" height="80" rx="8"/>
  <rect x="285" y="60" width="190" height="80" rx="8"/>
  <rect x="560" y="60" width="190" height="80" rx="8"/>
  <g fill="#a0a0a0" stroke="none" text-anchor="middle">
    <text x="105" y="106">AI client</text>
    <text x="380" y="106">Scenery runner</text>
    <text x="655" y="106">Scenery control plane</text>
    <text x="242" y="82" font-size="13">tools</text>
    <text x="242" y="128" font-size="13">requests</text>
    <text x="517" y="82" font-size="13">approved tools</text>
    <text x="517" y="128" font-size="13">activity</text>
  </g>
  <path d="M205 100 H280" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M480 100 H555" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
